name: trivia
description: "TriviaHQ - an offline trivia quiz game built with Flutter and Isar."
publish_to: 'none'

# version: <major>.<minor>.<patch>+<build>
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # State management.
  provider: ^6.1.5+1

  # Local, offline-first persistence.
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # Presentation.
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.1
  intl: ^0.20.2

  # Audio + file system.
  just_audio: ^0.10.5
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generates the Isar schemas in lib/models/*.g.dart:
  #   dart run build_runner build --delete-conflicting-outputs
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true

  assets:
    - assets/trivia.json
    - assets/images/
    - assets/audio/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito/Nunito-Bold.ttf
          weight: 700
