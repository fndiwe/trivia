# Static analysis configuration for TriviaHQ.
#
# Run locally with `flutter analyze` (or `dart analyze`).
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated by `dart run build_runner build`.
    - "**/*.g.dart"
  errors:
    # Isar generates code from annotations the analyzer does not know about.
    invalid_annotation_target: ignore

linter:
  rules:
    avoid_print: true
    prefer_single_quotes: true
    prefer_final_locals: true
    sort_child_properties_last: true
    use_super_parameters: true
